spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5430/order_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info